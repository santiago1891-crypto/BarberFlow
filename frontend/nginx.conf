# BarberFlow — Frontend (producción)
#
# Servidor estático para el build de Vite. El enrutamiento de la API
# (/api -> backend) lo hace Caddy (ver Caddyfile en la raíz del repo),
# así que acá solo servimos el SPA.
#
# IMPORTANTE: si una ubicación define su propio `add_header`, nginx deja de
# heredar los del bloque `server`. Por eso las cabeceras de seguridad se
# repiten en cada ubicación que agrega headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El shell de la app nunca se cachea: así un deploy nuevo se ve al
    # instante (los assets llevan hash de contenido en el nombre).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Assets con hash en el nombre: caché agresivo, nunca invalida.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: cualquier ruta que no exista cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
